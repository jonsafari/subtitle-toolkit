[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-toolkit"
version = "0.9.7.4"
description = "Subtitle Toolkit - A collection of utilities for working with subtitle files"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.8"
dependencies = [
    "litellm>=1.0",
    "tqdm>=4.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["subtitle", "srt", "translation", "timeshift", "mkv", "video"]

[project.urls]
Homepage = "https://github.com/jonsafari/subtitle-toolkit"
Repository = "https://github.com/jonsafari/subtitle-toolkit"
Documentation = "https://github.com/jonsafari/subtitle-toolkit#readme"

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "lattifai-captions>=0.2.7",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.1.0",
]

all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "lattifai-captions>=0.2.7",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
subtitle-tk = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "src.web*"]

[tool.setuptools.package-data]
src = ["py.typed", "templates/*", "templates/**/*.html", "static/*", "static/**/*", "translations/*.json", "translation_instruction_prompts/*"]
