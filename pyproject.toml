[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-toolkit"
version = "0.1.0"
description = "A toolkit for fixing and translating SRT subtitle files"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "jon", email = "jon@example.com"}
]
requires-python = ">=3.8"
dependencies = [
    "litellm>=1.0",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
subtitle-tk = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
src = ["py.typed"]